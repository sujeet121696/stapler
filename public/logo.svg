<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stapler">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- back sheet -->
  <rect x="24" y="12" width="26" height="33" rx="3" fill="#ffffff" fill-opacity="0.55"/>
  <!-- front sheet -->
  <rect x="14" y="19" width="26" height="33" rx="3" fill="#ffffff"/>
  <g fill="#0b0f19" fill-opacity="0.22">
    <rect x="19" y="33" width="16" height="2.5" rx="1.25"/>
    <rect x="19" y="39" width="16" height="2.5" rx="1.25"/>
    <rect x="19" y="45" width="10" height="2.5" rx="1.25"/>
  </g>
  <!-- staple joining both sheets -->
  <path d="M18 27 L30 15" stroke="#0b0f19" stroke-width="4" stroke-linecap="round"/>
</svg>
